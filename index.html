  <title>ИП-391 • 2-я подгруппа</title>
  <style>
    :root {
      --bg: #090a0f;
      --card-bg: rgba(255, 255, 255, 0.05);
      --card-border: rgba(255, 255, 255, 0.08);
      --card-active: rgba(10, 132, 255, 0.12);
      --card-active-border: rgba(10, 132, 255, 0.4);
      --accent: #2997ff;
      --accent-glow: rgba(41, 151, 255, 0.35);
      --text: #f5f5f7;
      --subtext: #86868b;
      --tag-lk-bg: rgba(191, 90, 242, 0.18);
      --tag-lk-text: #da8fff;
      --tag-pz-bg: rgba(255, 159, 10, 0.18);
      --tag-pz-text: #ffb340;
      --tag-lr-bg: rgba(48, 209, 88, 0.18);
      --tag-lr-text: #5ce681;
      --tag-mixed-bg: rgba(100, 210, 255, 0.16);
      --tag-mixed-text: #78d7ff;
    }

    * {
      box-sizing: border-box;
      -webkit-font-smoothing: antialiased;
    }

    body {
      margin: 0;
      padding: calc(env(safe-area-inset-top) + 16px) 16px calc(env(safe-area-inset-bottom) + 24px) 16px;
      background: var(--bg);
      background-image: 
        radial-gradient(at 0% 0%, rgba(41, 151, 255, 0.12) 0px, transparent 50%),
        radial-gradient(at 100% 100%, rgba(191, 90, 242, 0.08) 0px, transparent 50%);
      background-attachment: fixed;
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", sans-serif;
      min-height: 100vh;
      -webkit-tap-highlight-color: transparent;
    }

    /* Верхний блок заголовка */
    header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 18px;
    }

    .group-title {
      font-size: 26px;
      font-weight: 800;
      letter-spacing: -0.5px;
      margin: 0;
    }

    .subgroup-label {
      font-size: 13px;
      color: var(--subtext);
      margin-top: 3px;
      font-weight: 500;
    }

    .live-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 12px;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid var(--card-border);
      backdrop-filter: blur(20px);
      border-radius: 30px;
      font-size: 12px;
      font-weight: 600;
      color: var(--accent);
    }

    .live-pulse {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 0 10px var(--accent);
      animation: pulse 2s infinite ease-in-out;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(0.85); }
    }

    /* Переключатель 4 недель */
    .week-selector {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 7px;
      background: rgba(255, 255, 255, 0.04);
      padding: 4px;
      border-radius: 14px;
      border: 1px solid var(--card-border);
      margin-bottom: 12px;
    }

    .w-btn {
      background: transparent;
      border: none;
      color: var(--subtext);
      padding: 9px 0;
      border-radius: 10px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      position: relative;
      transition: all 0.2s cubic-bezier(0.2, 0.8, 0.2, 1);
    }

    .w-btn.active {
      background: var(--card-bg);
      color: var(--text);
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.4);
      border: 1px solid rgba(255, 255, 255, 0.12);
    }

    .w-btn.today::after {
      content: "";
      position: absolute;
      bottom: 3px;
      left: 50%;
      transform: translateX(-50%);
      width: 4px;
      height: 4px;
      border-radius: 50%;
      background: var(--accent);
    }

    /* Дни недели */
    .days-bar {
      display: flex;
      gap: 6px;
      margin-bottom: 18px;
    }

    .d-btn {
      flex: 1;
      padding: 9px 0;
      border-radius: 14px;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid transparent;
      color: var(--subtext);
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .d-btn.active {
      background: #ffffff;
      color: #000000;
      font-weight: 700;
      box-shadow: 0 6px 18px rgba(255, 255, 255, 0.2);
    }

    /* Карточки пар */
    .card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-radius: 18px;
      padding: 16px;
      margin-bottom: 12px;
      transition: transform 0.15s ease, border-color 0.2s ease;
      position: relative;
      overflow: hidden;
    }

    .card.now-ongoing {
      background: var(--card-active);
      border-color: var(--card-active-border);
      box-shadow: 0 8px 24px var(--accent-glow);
    }

    .card.now-ongoing::before {
      content: "ИДЁТ СЕЙЧАС";
      position: absolute;
      top: 10px;
      right: 14px;
      font-size: 9px;
      font-weight: 800;
      color: var(--accent);
      letter-spacing: 0.5px;
    }

    .card-top {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 8px;
    }

    .card-time {
      font-size: 13px;
      font-weight: 700;
      color: var(--subtext);
      letter-spacing: -0.2px;
    }

    .card-badge {
      font-size: 11px;
      font-weight: 700;
      padding: 3px 8px;
      border-radius: 8px;
      text-transform: uppercase;
      letter-spacing: 0.4px;
    }

    .badge-lk { background: var(--tag-lk-bg); color: var(--tag-lk-text); }
    .badge-pz { background: var(--tag-pz-bg); color: var(--tag-pz-text); }
    .badge-lr { background: var(--tag-lr-bg); color: var(--tag-lr-text); }
    .badge-lkpz { background: var(--tag-mixed-bg); color: var(--tag-mixed-text); }

    .card-title {
      font-size: 17px;
      font-weight: 600;
      line-height: 1.35;
      margin: 0 0 10px 0;
      letter-spacing: -0.3px;
    }

    .card-info {
      display: flex;
      flex-wrap: wrap;
      gap: 14px;
      font-size: 13px;
      color: var(--subtext);
    }

    .info-item {
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .info-item svg {
      width: 14px;
      height: 14px;
      fill: currentColor;
      opacity: 0.7;
    }

    /* Заглушка, если занятий нет */
    .empty-state {
      text-align: center;
      padding: 60px 20px;
      background: var(--card-bg);
      border-radius: 20px;
      border: 1px dashed var(--card-border);
    }

    .empty-icon {
      font-size: 38px;
      margin-bottom: 8px;
      display: inline-block;
    }

    .empty-text {
      font-size: 15px;
      color: var(--subtext);
      font-weight: 500;
    }

    /* Кнопка сброса на сегодняшний день */
    .reset-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      width: 100%;
      background: transparent;
      border: none;
      color: var(--accent);
      font-size: 14px;
      font-weight: 600;
      padding: 14px;
      cursor: pointer;
      margin-top: 8px;
    }
  </style>
</head>

    function getLiveWeek(date) {
      const msInWeek = 7 * 24 * 60 * 60 * 1000;
      const diff = Math.floor((date - SEMESTER_START) / msInWeek);
      return ((diff % 4) + 4) % 4 + 1;
    }

    const todayDate = new Date();
    const isSunday = (todayDate.getDay() === 0);
    const targetDate = isSunday ? new Date(todayDate.getTime() + 24 * 60 * 60 * 1000) : todayDate;

    const realLiveWeek = getLiveWeek(targetDate);
    const realLiveDay = isSunday ? 1 : todayDate.getDay();

    let viewWeek = realLiveWeek;
    let viewDay = realLiveDay;

    function isLessonOngoing(lesson, w, d) {
      if (todayDate.getDay() === 0 || w !== realLiveWeek || d !== todayDate.getDay()) return false;
      const now = new Date();
      const currentMinutes = now.getHours() * 60 + now.getMinutes();

      const [sh, sm] = lesson.start.split(':').map(Number);
      const [eh, em] = lesson.end.split(':').map(Number);
      const startMin = sh * 60 + sm;
      const endMin = eh * 60 + em;

      return currentMinutes >= startMin && currentMinutes <= endMin;
    }

    function render() {
      // Статус недели в шапке
      document.getElementById('cycleStatus').innerText = `${realLiveWeek}-я неделя`;
      
      const dayOptions = { month: 'long', day: 'numeric', weekday: 'short' };
      document.getElementById('currentDateStr').innerText = todayDate.toLocaleDateString('ru-RU', dayOptions);

      // Кнопки 4 недель
      const weekBar = document.getElementById('weekBar');
      weekBar.innerHTML = [1, 2, 3, 4].map(w => `
        <button class="w-btn ${w === viewWeek ? 'active' : ''} ${w === realLiveWeek ? 'today' : ''}" 
                onclick="setWeek(${w})">
          ${w} нед
        </button>
      `).join('');

      // Кнопки дней
      const dayNames = ['Пн', 'Вт', 'Ср', 'Чт', 'Пт', 'Сб'];
      const dayBar = document.getElementById('dayBar');
      dayBar.innerHTML = dayNames.map((d, i) => `
        <button class="d-btn ${i + 1 === viewDay ? 'active' : ''}" onclick="setDay(${i + 1})">
          ${d}
        </button>
      `).join('');

      // Контейнер списка
      const container = document.getElementById('cardsList');
      const lessons = (schedule[viewWeek] && schedule[viewWeek][viewDay]) || [];

      if (lessons.length === 0) {
        container.innerHTML = `
          <div class="empty-state">
            <div class="empty-icon">☕️</div>
            <div class="empty-text">Пар нет — свободный день!</div>
          </div>
        `;
        return;
      }

      container.innerHTML = lessons.map(l => {
        let badgeClass = "badge-lk";
        let badgeText = "Лекция";
        if (l.type === "pz") { badgeClass = "badge-pz"; badgeText = "Практика"; }
        if (l.type === "lr") { badgeClass = "badge-lr"; badgeText = "Лабораторная"; }
        if (l.type === "lkpz") { badgeClass = "badge-lkpz"; badgeText = "Лекция / практика"; }

        const ongoing = isLessonOngoing(l, viewWeek, viewDay);

        return `
          <div class="card ${ongoing ? 'now-ongoing' : ''}">
            <div class="card-top">
              <span class="card-time">${l.time}</span>
              <span class="card-badge ${badgeClass}">${badgeText}</span>
            </div>
            <h2 class="card-title">${l.title}</h2>
            <div class="card-info">
              <div class="info-item">
                <svg viewBox="0 0 24 24"><path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5a2.5 2.5 0 0 1 0-5 2.5 2.5 0 0 1 0 5z"/></svg>
                <span>ауд. ${l.room}</span>
              </div>
              ${l.teacher ? `
                <div class="info-item">
                  <svg viewBox="0 0 24 24"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
                  <span>${l.teacher}</span>
                </div>
              ` : ''}
            </div>
          </div>
        `;
      }).join('');
    }

    function setWeek(w) { viewWeek = w; render(); }
    function setDay(d) { viewDay = d; render(); }
    function goToToday() {
      viewWeek = realLiveWeek;
      viewDay = realLiveDay;
      render();
    }
